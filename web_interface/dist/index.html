<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung NASA MQTT Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #f7f7f7;
            border-radius: 6px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-indicator.connected {
            background: #10b981;
        }

        .status-indicator.disconnected {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .controls h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .filter-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .filter-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }

        .data-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .data-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .data-card.updated {
            animation: highlight 0.5s ease-in-out;
        }

        @keyframes highlight {
            0%, 100% { background: white; }
            50% { background: #fef3c7; }
        }

        .data-key {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .data-value {
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
            word-break: break-all;
        }

        .data-value.numeric {
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .empty-state h3 {
            color: #6b7280;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #9ca3af;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛰️ Samsung NASA MQTT Monitor</h1>
            <p>Real-time monitoring of NASA protocol values</p>
            <div class="status">
                <div class="status-item">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="statusText">Connecting...</span>
                </div>
                <div class="status-item">
                    <span><strong id="valueCount">0</strong> values</span>
                </div>
                <div class="status-item">
                    <span>Last update: <span id="lastUpdate">Never</span></span>
                </div>
            </div>
        </div>

        <div class="controls">
            <h2>Controls</h2>
            <input 
                type="text" 
                id="filterInput"
                placeholder="Filter by key name (e.g., 'temp', '0x4', 'zone')..."
                class="filter-input"
            >
            <div class="control-buttons">
                <button onclick="app.refresh()" class="btn btn-primary">🔄 Refresh</button>
                <button onclick="app.sortByKey()" class="btn btn-primary">🔤 Sort by Key</button>
                <button onclick="app.sortByValue()" class="btn btn-primary">🔢 Sort by Value</button>
                <button onclick="app.clearFilter()" class="btn btn-primary">✖️ Clear Filter</button>
            </div>
        </div>

        <div id="errorBox" class="error hidden">
            <strong>Error:</strong> <span id="errorText"></span>
        </div>

        <div id="loadingBox" class="loading">
            Loading NASA state...
        </div>

        <div id="emptyState" class="empty-state hidden">
            <h3>No data available</h3>
            <p>Waiting for NASA protocol data...</p>
        </div>

        <div id="dataGrid" class="data-grid">
        </div>
    </div>

    <script>
        const app = {
            nasaState: {},
            filterText: '',
            sortMode: 'none',
            lastUpdateTime: null,
            
            init() {
                // Set up event listeners
                document.getElementById('filterInput').addEventListener('input', (e) => {
                    this.filterText = e.target.value;
                    this.render();
                });
                
                // Initial load
                this.refresh();
                
                // Auto-refresh every 2 seconds
                setInterval(() => this.refresh(), 2000);
            },
            
            async refresh() {
                try {
                    const response = await fetch('/api/state');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    
                    // Track which values changed
                    const changedKeys = new Set();
                    for (const key in data) {
                        if (this.nasaState[key] !== data[key]) {
                            changedKeys.add(key);
                        }
                    }
                    
                    this.nasaState = data;
                    this.lastUpdateTime = new Date();
                    this.updateStatus(true);
                    this.hideError();
                    this.hideLoading();
                    this.render(changedKeys);
                } catch (e) {
                    this.showError(e.message);
                    this.updateStatus(false);
                    this.hideLoading();
                }
            },
            
            render(changedKeys = new Set()) {
                const grid = document.getElementById('dataGrid');
                const entries = this.getFilteredEntries();
                
                if (entries.length === 0) {
                    grid.innerHTML = '';
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }
                
                document.getElementById('emptyState').classList.add('hidden');
                
                grid.innerHTML = entries.map(([key, value]) => {
                    const isNumeric = !isNaN(value) && !isNaN(parseFloat(value));
                    const changed = changedKeys.has(key);
                    return `
                        <div class="data-card ${changed ? 'updated' : ''}">
                            <div class="data-key">${this.escapeHtml(key)}</div>
                            <div class="data-value ${isNumeric ? 'numeric' : ''}">
                                ${this.escapeHtml(this.formatValue(value))}
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Update value count
                document.getElementById('valueCount').textContent = Object.keys(this.nasaState).length;
            },
            
            getFilteredEntries() {
                let entries = Object.entries(this.nasaState);
                
                // Filter
                if (this.filterText.trim()) {
                    const filter = this.filterText.toLowerCase();
                    entries = entries.filter(([key, value]) => 
                        key.toLowerCase().includes(filter) ||
                        String(value).toLowerCase().includes(filter)
                    );
                }
                
                // Sort
                if (this.sortMode === 'key') {
                    entries.sort((a, b) => a[0].localeCompare(b[0]));
                } else if (this.sortMode === 'value') {
                    entries.sort((a, b) => String(a[1]).localeCompare(String(b[1])));
                }
                
                return entries;
            },
            
            sortByKey() {
                this.sortMode = this.sortMode === 'key' ? 'none' : 'key';
                this.render();
            },
            
            sortByValue() {
                this.sortMode = this.sortMode === 'value' ? 'none' : 'value';
                this.render();
            },
            
            clearFilter() {
                this.filterText = '';
                document.getElementById('filterInput').value = '';
                this.render();
            },
            
            formatValue(value) {
                if (value === null || value === undefined) {
                    return 'N/A';
                }
                return String(value);
            },
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            
            updateStatus(connected) {
                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                
                if (connected) {
                    indicator.classList.add('connected');
                    indicator.classList.remove('disconnected');
                    statusText.textContent = 'Connected';
                } else {
                    indicator.classList.add('disconnected');
                    indicator.classList.remove('connected');
                    statusText.textContent = 'Disconnected';
                }
                
                if (this.lastUpdateTime) {
                    document.getElementById('lastUpdate').textContent = this.lastUpdateTime.toLocaleTimeString();
                }
            },
            
            showError(message) {
                document.getElementById('errorText').textContent = message;
                document.getElementById('errorBox').classList.remove('hidden');
            },
            
            hideError() {
                document.getElementById('errorBox').classList.add('hidden');
            },
            
            hideLoading() {
                document.getElementById('loadingBox').classList.add('hidden');
            }
        };
        
        // Initialize app when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => app.init());
        } else {
            app.init();
        }
    </script>
</body>
</html>
